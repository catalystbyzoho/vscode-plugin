#$Id$ 

### PRODUCT_NAME should be same in webhost ####

productname="vscode_plugin"
JAVA_HOME="/usr/java/jdk1.8.0_112"
ANT_HOME="/usr/ant/apache-ant-1.9.6"
NODE_HOME="/usr/node/v22.5.1"
PATH=${JAVA_HOME}/bin:${ANT_HOME}/bin:${NODE_HOME}/bin:${PATH}
export JAVA_HOME ANT_HOME NODE_HOME PATH
export LC_ALL=en_US.UTF-8
DOCKER_STEP_BUILD="Yes"

### CHECKOUT DETAILS ###


BUILD_BASE_DIR=VSCODE_PLUGIN
BUILD_OUTPUT=${BUILD_BASE_DIR}/output

################################PAM360

commonzip_name=VSCODE_PLUGIN.zip


################################

getBuildoptions()
{

        BUILD_OPTS="-Dtarget=${TARGET} -Dday=${TODAY} -Ddate=${BUILD_DLOAD_DIR} -Derror_id=${ERROR_MAIL_ID}"
}

######################### REPORTS VARIABLES ###############################

DIFF_ZIP="VSCODE_PLUGIN.zip"
BINARY_LIST="VSCODE_PLUGIN.zip"
